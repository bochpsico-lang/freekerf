[package]
name = "freekerf-desktop"
description = "The FreeKerf desktop app: a Tauri 2 shell over freekerf-service"
version.workspace = true
edition.workspace = true
# Tauri 2 needs a newer compiler than the rest of the workspace (MSRV job excludes this crate)
rust-version = "1.90"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "freekerf_desktop"
path = "src/lib.rs"

[[bin]]
name = "freekerf-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freekerf-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `tauri build` turns this on: assets embedded, no dev server
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
