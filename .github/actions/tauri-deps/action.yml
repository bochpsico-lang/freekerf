name: tauri-deps
description: System libraries to build the Tauri 2 desktop app on Ubuntu (WebKitGTK 4.1 and friends)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
          webkit2gtk-driver xvfb
