name: release

# Installers of the desktop app (PLAN.md M5). A tag `v<version>` builds them,
# smoke-tests each one and attaches them to a draft GitHub release; a manual run
# or a pull request touching the packaging only builds and tests them (artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/smoke-windows-installer.ps1
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/icons/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # keep in sync with ci.yml and rust-toolchain.toml
  RUST_TOOLCHAIN: "1.97.0"
  NODE: "24"
  TAURI_CLI: "2.12.3"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the app version (tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, app version $version" }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - name: Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      # beforeBuildCommand builds ui/web; the CLI turns on `custom-protocol`
      - name: MSI and NSIS installers
        working-directory: apps/desktop
        run: cargo tauri build --ci --bundles msi,nsis
      - name: the installers install, the app starts and stays up, they uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./.github/scripts/smoke-windows-installer.ps1 -Installer $nsis.FullName -Kind nsis
          ./.github/scripts/smoke-windows-installer.ps1 -Installer $msi.FullName -Kind msi
      - name: checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/msi/*.msi, target/release/bundle/nsis/*-setup.exe dist/
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freekerf-windows
          path: dist/
          if-no-files-found: error

  publish:
    # a draft: a maintainer writes the notes from CHANGELOG.md and publishes it
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "FreeKerf ${GITHUB_REF_NAME#v}" --generate-notes dist/*
