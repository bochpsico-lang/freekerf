name: fuzz

# Scheduled fuzzing of the parsers that read files from users (PLAN §10, M2):
# G-code, SVG and DXF (through the planner) and LaserGRBL's BinaryFormatter files.
# Not on every push: it needs nightly and minutes per target.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gcode, svg, dxf, nrbf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: seed corpus from the test fixtures
        run: |
          mkdir -p fuzz/corpus/{gcode,svg,dxf,nrbf}
          find crates/core/freekerf-gcode/tests/fixtures -name '*.nc' -exec cp {} fuzz/corpus/gcode/ \;
          cp crates/runtime/freekerf-service/tests/fixtures/importers/inputs/svg/*.svg fuzz/corpus/svg/
          cp crates/runtime/freekerf-service/tests/fixtures/importers/inputs/dxf/*.dxf fuzz/corpus/dxf/
          cp crates/config/freekerf-migrate/tests/fixtures/*.bin fuzz/corpus/nrbf/
      - name: fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: >
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} --
          -max_total_time=${{ inputs.seconds || '600' }} -rss_limit_mb=2048 -max_len=65536 -timeout=30
      - name: keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
