# Flatpak of the desktop app and the `freekerf` CLI (doc/features/desktop-app.md
# "Releases"). Built offline: cargo-sources.json and node-sources.json come from
# the lock files (update-sources.sh regenerates them).
#
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.freekerf.FreeKerf.yml
#   flatpak run io.github.freekerf.FreeKerf
#   flatpak run --command=freekerf io.github.freekerf.FreeKerf mcp
id: io.github.freekerf.FreeKerf
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: freekerf-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # serial ports (/dev/ttyUSB*, /dev/ttyACM*) and the GPU (WebKit)
  - --device=all
  # serialport enumerates the ports through udev
  - --filesystem=/run/udev:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/freekerf/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_offline: 'true'
    npm_config_cache: /run/build/freekerf/flatpak-node/npm-cache
    XDG_CACHE_HOME: /run/build/freekerf/flatpak-node/cache
modules:
  - name: freekerf
    buildsystem: simple
    build-commands:
      # the front end (Vite), embedded by the custom-protocol build
      - npm ci --prefix ui/web --ignore-scripts --no-audit --no-fund
      - npm --prefix ui/web run build
      - cargo --offline build --release --locked -p freekerf-cli -p freekerf-desktop --features freekerf-desktop/custom-protocol
      - install -Dm755 target/release/freekerf-desktop /app/bin/freekerf-desktop
      - install -Dm755 target/release/freekerf /app/bin/freekerf
      - >-
        sed 's/{{exec}}/freekerf-desktop/g; s/{{icon}}/io.github.freekerf.FreeKerf/'
        packaging/linux/io.github.freekerf.FreeKerf.desktop.in
        > io.github.freekerf.FreeKerf.desktop
      - install -Dm644 io.github.freekerf.FreeKerf.desktop /app/share/applications/io.github.freekerf.FreeKerf.desktop
      # the .deb's desktop entry is not in the Flatpak
      - >-
        sed '/>FreeKerf.desktop</d' packaging/linux/io.github.freekerf.FreeKerf.metainfo.xml
        > io.github.freekerf.FreeKerf.metainfo.xml
      - install -Dm644 io.github.freekerf.FreeKerf.metainfo.xml /app/share/metainfo/io.github.freekerf.FreeKerf.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.freekerf.FreeKerf.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.freekerf.FreeKerf.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.freekerf.FreeKerf.png
      - install -Dm644 apps/desktop/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.freekerf.FreeKerf.png
    sources:
      # this checkout (CI and local builds); Flathub's copy of the manifest
      # points at a release tag instead (doc/roadmap.md)
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - build-dir
          - .flatpak-builder
          - ui/web/node_modules
          - ui/web/dist
      - cargo-sources.json
      - node-sources.json
